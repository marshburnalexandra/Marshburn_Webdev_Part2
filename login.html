<!DOCTYPE html>
<html>
<head>
    <title>Pokémon Trainer Login</title>
</head>
<body>
    <h1>Pokémon Trainer Login</h1>

    <form id="loginForm">
        <label for="username">Trainer name</label>
        <input type="text" id="username" required>
        <br><br>

        <label for="password">Password</label>
        <input type="password" id="password" required>
        <br><br>

        <button type="submit">Login</button>
    </form>

    <p id="message"></p>
    <p>New trainer? <a href="/register-page">Register here</a>.</p>

    <script>
        document.getElementById("loginForm").addEventListener("submit", async function(event) {
            event.preventDefault();
            const message = document.getElementById("message");

            try {
                const response = await fetch("/login", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({
                        username: document.getElementById("username").value,
                        password: document.getElementById("password").value
                    })
                });
                const result = await response.json();

                if (!result.success) {
                    message.textContent = result.message;
                    return;
                }

                sessionStorage.setItem("user_id", result.user_id);
                sessionStorage.setItem("username", result.username);
                window.location.href = "/collection";
            } catch (error) {
                message.textContent = "Could not connect to the app. Make sure the server is running.";
            }
        });
    </script>
</body>
</html>
