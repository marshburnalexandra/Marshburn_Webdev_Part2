<!DOCTYPE html>
<html>
<head>
    <title>Pokémon Trainer Collection</title>
</head>
<body>
    <h1>Pokémon Trainer Collection</h1>
    <p>Welcome, <span id="trainerName">Trainer</span>!</p>

    <h2>Add a Pokémon</h2>
    <form id="pokemonForm">
        <label for="pokemon_name">Pokémon name</label>
        <input type="text" id="pokemon_name" required>
        <br><br>

        <label for="level">Level (1–100)</label>
        <input type="number" id="level" min="1" max="100" value="5" required>
        <br><br>

        <label for="pokemon_type">Type</label>
        <input type="text" id="pokemon_type" placeholder="Electric" required>
        <br><br>

        <label for="region">Region</label>
        <input type="text" id="region" placeholder="Kanto" required>
        <br><br>

        <button type="submit">Add Pokémon</button>
    </form>

    <p id="message"></p>
    <h2>My Pokémon</h2>
    <div id="pokemonList"></div>
    <button id="logoutButton" type="button">Log out</button>

    <script>
        const userId = Number(sessionStorage.getItem("user_id"));
        const username = sessionStorage.getItem("username") || "Trainer";
        const message = document.getElementById("message");
        const pokemonList = document.getElementById("pokemonList");

        if (!userId) {
            window.location.href = "/login-page";
        }
        document.getElementById("trainerName").textContent = username;

        async function loadPokemon() {
            try {
                const response = await fetch("/pokemon/" + userId);
                const pokemon = await response.json();
                pokemonList.textContent = "";

                if (pokemon.length === 0) {
                    pokemonList.textContent = "No Pokémon yet. Add your first one above!";
                    return;
                }

                pokemon.forEach(function(item) {
                    const row = document.createElement("p");
                    row.textContent = item.pokemon_name + " — Level " + item.level +
                        " — " + item.pokemon_type + " type — " + item.region;
                    pokemonList.appendChild(row);
                });
            } catch (error) {
                message.textContent = "Could not load your collection.";
            }
        }

        document.getElementById("pokemonForm").addEventListener("submit", async function(event) {
            event.preventDefault();
            const pokemon = {
                pokemon_name: document.getElementById("pokemon_name").value,
                level: Number(document.getElementById("level").value),
                pokemon_type: document.getElementById("pokemon_type").value,
                region: document.getElementById("region").value,
                user_id: userId
            };

            try {
                const response = await fetch("/pokemon", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify(pokemon)
                });
                const result = await response.json();
                message.textContent = result.message || "Pokémon added!";
                if (result.success) {
                    event.target.reset();
                    document.getElementById("level").value = 5;
                    await loadPokemon();
                }
            } catch (error) {
                message.textContent = "Could not add Pokémon.";
            }
        });

        document.getElementById("logoutButton").addEventListener("click", function() {
            sessionStorage.clear();
            window.location.href = "/login-page";
        });

        loadPokemon();
    </script>
</body>
</html>
