<!DOCTYPE html>
<html>
<head>
    <title>Pokémon Trainer Registration</title>
</head>
<body>
    <h1>Create a Trainer Account</h1>

    <form id="registerForm">
        <label for="username">Trainer name</label>
        <input type="text" id="username" required>
        <br><br>

        <label for="password">Create password</label>
        <input type="password" id="password" required>
        <br><br>

        <label for="confirm_password">Confirm password</label>
        <input type="password" id="confirm_password" required>
        <br><br>

        <button type="submit">Register</button>
    </form>

    <p id="message"></p>
    <p><a href="/login-page">Back to login</a></p>

    <script>
        document.getElementById("registerForm").addEventListener("submit", async function(event) {
            event.preventDefault();
            const message = document.getElementById("message");
            const password = document.getElementById("password").value;

            if (password !== document.getElementById("confirm_password").value) {
                message.textContent = "Passwords do not match.";
                return;
            }

            try {
                const response = await fetch("/register", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({
                        username: document.getElementById("username").value,
                        password: password
                    })
                });
                const result = await response.json();
                message.textContent = result.message;
                if (result.success) {
                    setTimeout(function() { window.location.href = "/login-page"; }, 1200);
                }
            } catch (error) {
                message.textContent = "Could not connect to the app. Make sure the server is running.";
            }
        });
    </script>
</body>
</html>
